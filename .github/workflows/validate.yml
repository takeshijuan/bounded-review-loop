name: Validate Skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install validation dependency
        run: python -m pip install --require-hashes -r requirements-validation.txt
      - name: Install locked skills CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository and skill contract
        run: python scripts/validate_skill.py
      - name: Verify skills CLI discovery
        run: npx --no-install skills add . --list
